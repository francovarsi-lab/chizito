<!doctype html><html><body style="margin:0;background:#222"><canvas id="c" width="900" height="900"></canvas>
<script type="module">
import * as THREE from 'three';
import { createBrocoli, loadBroccoliParts } from '/src/creature/fight/brocoli.ts';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.localClippingEnabled = true;
r.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a2a30');
scene.add(new THREE.HemisphereLight('#ffffff', '#554433', 1.4));
const d = new THREE.DirectionalLight('#fff4e0', 2.5); d.position.set(2, 4, 5); scene.add(d);
const parts = q.has('proc') ? null : await loadBroccoliParts();
const b = createBrocoli({ level: 1, parts });
scene.add(b);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const [cx, cy, cz, lx, ly] = (q.get('cam') ?? '0,2.4,9,0,2.1').split(',').map(Number);
cam.position.set(cx, cy, cz); cam.lookAt(lx, ly, 0);
r.render(scene, cam);
document.body.dataset.ready = '1';
</script></body></html>
