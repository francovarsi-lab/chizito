<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hombrecito de chizito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&family=Bungee&family=Baloo+2:wght@800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fbeee9; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; }
      /* Ayuda: píldora translúcida, tipografía redondeada, aparece y se va con un fundido suave. */
      #help {
        position: fixed; left: 50%; bottom: 4vh; transform: translate(-50%, 0);
        padding: 9px 18px; border-radius: 999px;
        font: 500 13px/1.35 "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.01em; color: rgba(92, 64, 70, 0.92);
        background: rgba(255, 250, 247, 0.62);
        box-shadow: 0 6px 24px rgba(170, 110, 120, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2);
        pointer-events: none; user-select: none; white-space: nowrap;
        transition: opacity 0.9s cubic-bezier(.2,.7,.2,1), transform 0.9s cubic-bezier(.2,.7,.2,1), filter 0.9s ease;
      }
      #help.hidden { opacity: 0; transform: translate(-50%, 10px); filter: blur(4px); }
      /* Papel del palito de la selva con un dato curioso: de frente, un rato, sin tapar el mouse. */
      #fact {
        position: fixed; left: 50%; top: 9vh; width: min(440px, 88vw); box-sizing: border-box;
        transform: translate(-50%, 0) translate(var(--dx, 0), var(--dy, 0)) scale(0.12) rotate(-24deg);
        opacity: 0; pointer-events: none; user-select: none; overflow: hidden;
        border-radius: 14px; background: #f9e4ec;
        box-shadow: 0 18px 44px rgba(120, 50, 80, 0.28), 0 2px 0 rgba(255, 255, 255, 0.6) inset;
        transition: transform 0.75s cubic-bezier(.2, 1.25, .3, 1), opacity 0.3s ease;
      }
      #fact.in { transform: translate(-50%, 0) rotate(-1.5deg); opacity: 1; }
      #fact.out { transform: translate(-50%, -16px) rotate(1deg); opacity: 0; transition: transform 0.6s ease-in, opacity 0.6s ease-in; }
      #fact .band {
        height: 18px; background: #2f6b2a;
        background-image: radial-gradient(ellipse 14px 6px at 12px 9px, #5aa548 60%, transparent 62%), radial-gradient(ellipse 12px 5px at 34px 5px, #1f4f1f 60%, transparent 62%);
        background-size: 48px 18px;
      }
      #fact .body {
        padding: 16px 22px 18px 34px; position: relative; text-align: center;
        background: linear-gradient(90deg, #f9e4ec, #f3d3df 50%, #f9e4ec);
      }
      #fact .body::before { /* franja amarilla con borde rojo, como en el papel */
        content: ""; position: absolute; left: 12px; top: 12px; bottom: 12px; width: 8px; border-radius: 6px;
        background: #ffe14d; box-shadow: 0 0 0 3px #e8352b;
      }
      #fact .kicker { font: 800 clamp(13px, 1.5vw, 15px)/1 "Baloo 2", "Nunito", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #2f6b2a; margin-bottom: 8px; }
      #fact .text { font: 600 clamp(17px, 2.2vw, 22px)/1.3 "Nunito", ui-rounded, system-ui, sans-serif; color: #5a3040; text-wrap: balance; }
      /* Velo de entrada: la escena aparece desde un blanco cremoso. */
      body::after {
        content: ""; position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, #fffaf6 0%, #fbeee9 70%, #f6e2de 100%);
        opacity: 1; transition: opacity 1.4s cubic-bezier(.3,.6,.2,1) 0.15s;
      }
      body.ready::after { opacity: 0; }
      #angle {
        position: fixed; left: 0; top: 0; pointer-events: none; user-select: none;
        padding: 3px 8px; border-radius: 999px;
        font: 600 11px/1 "Nunito", ui-rounded, system-ui, sans-serif; letter-spacing: 0.03em;
        color: rgba(110, 76, 82, 0.85); background: rgba(255, 250, 247, 0.5);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        white-space: nowrap; transition: opacity 0.35s ease;
      }
      #angle.hidden { opacity: 0; }
      /* ── Título de la intro ("CUMPLEAÑITO"). Tres estilos para comparar: ?titulo=arcade|globo|neon ── */
      #title {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.2vh; padding-bottom: 12vh; pointer-events: none; user-select: none; overflow: hidden;
        background: radial-gradient(ellipse at 50% 38%, rgba(255, 246, 240, 0.0) 30%, rgba(120, 60, 80, 0.16) 100%);
        transition: opacity 0.8s ease;
      }
      #title .logo { margin: 0; line-height: 1; white-space: nowrap; font-size: clamp(48px, 10vw, 148px); }
      #title .logo span { display: inline-block; animation: hop 1.6s cubic-bezier(.3,.6,.3,1) infinite; animation-delay: calc(var(--i) * 0.08s); }
      @keyframes hop { 0%, 60%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-0.12em) rotate(-3deg); } }
      #title .sub {
        font: 800 clamp(14px, 1.6vw, 22px)/1 "Baloo 2", "Nunito", sans-serif; letter-spacing: 0.06em;
        color: #8a4d62; background: rgba(255, 250, 247, 0.72); padding: 6px 16px 3px; border-radius: 999px;
        box-shadow: 0 6px 20px rgba(170, 90, 120, 0.2);
      }
      #title .start {
        margin-top: 4vh; font: 400 clamp(14px, 1.5vw, 20px)/1 "Bungee", sans-serif; letter-spacing: 0.16em;
        color: #fff; text-shadow: 0 2px 0 #e45a84, 0 4px 14px rgba(200, 60, 110, 0.45);
        animation: blink 1.1s steps(2, jump-none) infinite;
      }
      @keyframes blink { 50% { opacity: 0.15; } }
      #title .confetti i {
        position: absolute; top: -4vh; width: 9px; height: 14px; border-radius: 2px; opacity: 0.85;
        animation: fall linear infinite;
      }
      @keyframes fall { to { transform: translateY(112vh) rotate(var(--r)) rotateX(720deg); } }
      #title.leaving { opacity: 0; transition-delay: 0.35s; }
      #title.leaving .logo span { animation: pop 0.6s cubic-bezier(.5,-0.6,.7,.4) forwards; animation-delay: calc(var(--i) * 0.03s); }
      @keyframes pop { to { transform: translateY(-0.5em) scale(1.6); opacity: 0; } }

      /* arcade: letras de cartel gruesas, caramelo con borde blanco y relieve. */
      #title[data-style="arcade"] .logo { font-family: "Bungee", sans-serif; transform: rotate(-3deg); }
      #title[data-style="arcade"] .logo span {
        color: var(--c); -webkit-text-stroke: 0.06em #fff; paint-order: stroke fill;
        text-shadow: 0 0.03em 0 #fff, 0 0.06em 0 #e9a3b7, 0 0.09em 0 #d9879f, 0 0.12em 0 #c86f88,
          0 0.2em 0.25em rgba(140, 50, 80, 0.35);
      }
      /* globo: letras infladas y brillantes, como globos metalizados pastel. */
      #title[data-style="globo"] .logo { font-family: "Baloo 2", sans-serif; font-weight: 800; letter-spacing: -0.02em; }
      #title[data-style="globo"] .logo span {
        background: radial-gradient(circle at 35% 28%, #fff 0 8%, var(--c) 34%, color-mix(in srgb, var(--c) 70%, #5a2440) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        /* Contorno blanco con sombras (el text-stroke marcaba los solapes internos de Baloo como rayas). */
        filter: drop-shadow(0.025em 0 0 #fff) drop-shadow(-0.025em 0 0 #fff) drop-shadow(0 0.025em 0 #fff)
          drop-shadow(0 -0.025em 0 #fff) drop-shadow(0 0.07em 0.05em rgba(120, 40, 70, 0.35));
      }
      /* neon: tubos de neón pastel que titilan apenas. */
      #title[data-style="neon"] .logo { font-family: "Bungee", sans-serif; }
      #title[data-style="neon"] .logo span {
        color: #fffaf6;
        text-shadow: 0 0 0.04em #fff, 0 0 0.1em var(--c), 0 0 0.25em var(--c), 0 0 0.5em var(--c);
        animation: hop 1.6s cubic-bezier(.3,.6,.3,1) infinite, flicker 4s linear infinite;
        animation-delay: calc(var(--i) * 0.08s), calc(var(--i) * 0.37s);
      }
      @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: 0.55; } 95% { opacity: 1; } 96% { opacity: 0.7; } }

      body.grab canvas { cursor: grabbing; }
      body.over-bowl canvas { cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="help">arrastrá para girar · tocá un recipiente para agarrar · F muestra el frente · Ctrl+S guarda la criatura</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
